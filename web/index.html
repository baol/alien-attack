<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Alien Attack - Space Invaders</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #050512;
      color: #c8dcff;
      font-family: monospace;
      overflow: hidden;
      touch-action: none;
    }

    #app-wrapper {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 4px) env(safe-area-inset-right, 6px) env(safe-area-inset-bottom, 6px) env(safe-area-inset-left, 6px);
      gap: 6px;
      background: #050512;
    }

    #game-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #284b8c;
      border-radius: 6px;
      box-shadow: 0 0 24px rgba(0, 210, 255, 0.2);
      background: #050512;
      overflow: hidden;
      flex-shrink: 1;
    }

    /* Always preserve 4:3 aspect ratio in both Portrait and Landscape */
    canvas#bevy-canvas {
      display: block;
      aspect-ratio: 4 / 3;
      width: min(96vw, calc(82dvh * 4 / 3)) !important;
      height: auto !important;
      max-height: 82dvh;
      outline: none;
      touch-action: none;
    }

    /* When in Fullscreen / Pseudo-Fullscreen mode, expand canvas to fill screen */
    body.is-fullscreen #game-container {
      border-width: 1px;
    }
    body.is-fullscreen canvas#bevy-canvas {
      width: min(100vw, calc(100dvh * 4 / 3)) !important;
      max-height: 100dvh;
    }

    #loading {
      position: absolute;
      font-size: 16px;
      color: #4df2ff;
      letter-spacing: 1px;
      pointer-events: none;
      white-space: nowrap;
    }

    /* Fullscreen Toggle Button (Top-Right) */
    #btn-fullscreen {
      position: fixed;
      top: max(8px, env(safe-area-inset-top, 8px));
      right: max(10px, env(safe-area-inset-right, 10px));
      z-index: 40;
      background: rgba(10, 18, 44, 0.88);
      color: #4df2ff;
      border: 1.5px solid #3a75c4;
      border-radius: 6px;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 12px;
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.25);
      touch-action: manipulation;
    }
    #btn-fullscreen:active {
      background: rgba(30, 80, 150, 0.95);
      transform: scale(0.95);
    }

    /* Mobile Touch Controls Bar */
    #mobile-controls {
      display: none;
      width: 100%;
      max-width: 760px;
      height: 60px;
      padding: 0 4px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 30;
      flex-shrink: 0;
    }

    /* Portrait & narrow touch devices: dock controls bar below the canvas */
    @media (pointer: coarse), (max-width: 900px) {
      #mobile-controls {
        display: flex;
      }
      canvas#bevy-canvas {
        width: min(98vw, calc((100dvh - 78px) * 4 / 3)) !important;
        max-height: calc(100dvh - 78px);
      }
    }

    /* Landscape on mobile: float semi-transparent controls at bottom corners so canvas gets full height */
    @media ((pointer: coarse) or (max-width: 950px)) and (orientation: landscape) {
      #mobile-controls {
        position: fixed;
        bottom: max(6px, env(safe-area-inset-bottom, 6px));
        left: max(8px, env(safe-area-inset-left, 8px));
        right: max(8px, env(safe-area-inset-right, 8px));
        width: auto;
        max-width: none;
        height: 54px;
        pointer-events: none;
      }
      #swipe-zone,
      .action-buttons {
        pointer-events: auto;
      }
      #swipe-zone {
        max-width: 42vw;
        background: rgba(12, 26, 58, 0.55) !important;
      }
      canvas#bevy-canvas {
        width: min(98vw, calc(96dvh * 4 / 3)) !important;
        max-height: 96dvh;
      }
    }

    #swipe-zone {
      flex: 1;
      min-width: 110px;
      height: 54px;
      background: linear-gradient(90deg, rgba(16, 32, 72, 0.8), rgba(24, 52, 105, 0.6), rgba(16, 32, 72, 0.8));
      border: 1.5px solid #2e62b0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #82c8ff;
      font-size: clamp(11px, 3vw, 13px);
      font-weight: bold;
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      touch-action: none;
    }
    #swipe-thumb {
      position: absolute;
      width: 38px;
      height: 44px;
      border-radius: 7px;
      background: rgba(77, 242, 255, 0.3);
      border: 1.5px solid #4df2ff;
      pointer-events: none;
      opacity: 0;
    }

    .action-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }
    .touch-btn {
      height: 54px;
      padding: 0 10px;
      border-radius: 10px;
      font-family: monospace;
      font-weight: bold;
      font-size: 12px;
      white-space: nowrap;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      touch-action: none;
    }
    #btn-shield {
      min-width: 72px;
      background: radial-gradient(circle, rgba(20, 110, 140, 0.82), rgba(10, 45, 75, 0.88));
      border: 1.5px solid #2ce6ff;
      color: #b8ffff;
      box-shadow: 0 0 10px rgba(44, 230, 255, 0.25);
    }
    #btn-shield.active {
      background: rgba(44, 230, 255, 0.55);
      transform: scale(0.95);
    }
    #btn-fire {
      min-width: 82px;
      background: radial-gradient(circle, rgba(160, 110, 15, 0.88), rgba(90, 35, 10, 0.92));
      border: 1.5px solid #ffde3b;
      color: #fff8c4;
      box-shadow: 0 0 12px rgba(255, 222, 59, 0.3);
    }
    #btn-fire.active {
      background: radial-gradient(circle, rgba(255, 210, 40, 0.85), rgba(190, 95, 15, 0.95));
      border-color: #ffffff;
      transform: scale(0.95);
    }
    .btn-sub {
      font-size: 9px;
      opacity: 0.85;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <!-- Shared DOM state bridge read directly by Bevy on WASM every frame -->
  <div id="touch-state" data-dx="0" data-fire="0" data-fire-released="0" data-shield="0" data-restart="0" style="display:none;"></div>

  <div id="app-wrapper">
    <button id="btn-fullscreen" type="button" title="Toggle Fullscreen">&#x26F6; FULL</button>

    <div id="game-container">
      <div id="loading">LOADING ALIEN ATTACK...</div>
      <canvas id="bevy-canvas" tabindex="0"></canvas>
    </div>

    <div id="mobile-controls">
      <div id="swipe-zone">
        <div id="swipe-thumb"></div>
        <span>&#x2194; SWIPE</span>
      </div>
      <div class="action-buttons">
        <button id="btn-shield" class="touch-btn" type="button">
          <span>SHIELD</span>
          <span class="btn-sub">2.5s</span>
        </button>
        <button id="btn-fire" class="touch-btn" type="button">
          <span>FIRE</span>
          <span class="btn-sub">2s BEAM</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import init from './alien-attack.js';

    const docEl = document.documentElement;
    const canvas = document.getElementById('bevy-canvas');
    const loading = document.getElementById('loading');
    const touchState = document.getElementById('touch-state');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const swipeZone = document.getElementById('swipe-zone');
    const swipeThumb = document.getElementById('swipe-thumb');
    const btnShield = document.getElementById('btn-shield');
    const btnFire = document.getElementById('btn-fire');

    function addSwipeDelta(dx) {
      const cur = parseFloat(touchState.getAttribute('data-dx') || '0') || 0;
      touchState.setAttribute('data-dx', (cur + dx).toFixed(2));
    }

    // Fullscreen toggle (Native Fullscreen API + CSS pseudo-fullscreen fallback for iOS Safari)
    async function toggleFullscreen(e) {
      if (e) e.preventDefault();
      const nativeFs = document.fullscreenElement || document.webkitFullscreenElement;
      const pseudoFs = document.body.classList.contains('is-fullscreen');

      if (!nativeFs && !pseudoFs) {
        document.body.classList.add('is-fullscreen');
        btnFullscreen.innerHTML = '&#x2715; EXIT';
        try {
          if (docEl.requestFullscreen) {
            await docEl.requestFullscreen();
          } else if (docEl.webkitRequestFullscreen) {
            docEl.webkitRequestFullscreen();
          }
        } catch (_) {
          // Keep CSS pseudo-fullscreen active even if browser blocks native API
        }
      } else {
        document.body.classList.remove('is-fullscreen');
        btnFullscreen.innerHTML = '&#x26F6; FULL';
        try {
          if (document.fullscreenElement && document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        } catch (_) {}
      }
      window.scrollTo(0, 0);
      canvas.focus();
    }

    btnFullscreen.addEventListener('click', toggleFullscreen);
    btnFullscreen.addEventListener('touchend', toggleFullscreen, { passive: false });

    document.addEventListener('fullscreenchange', () => {
      const active = !!document.fullscreenElement;
      document.body.classList.toggle('is-fullscreen', active);
      btnFullscreen.innerHTML = active ? '&#x2715; EXIT' : '&#x26F6; FULL';
    });

    // Button 1: Temporary Shield
    function startShield(e) {
      e.preventDefault();
      btnShield.classList.add('active');
      touchState.setAttribute('data-shield', '1');
    }
    function endShield(e) {
      e.preventDefault();
      btnShield.classList.remove('active');
    }
    btnShield.addEventListener('touchstart', startShield, { passive: false });
    btnShield.addEventListener('touchend', endShield, { passive: false });
    btnShield.addEventListener('touchcancel', endShield, { passive: false });
    btnShield.addEventListener('mousedown', startShield);
    btnShield.addEventListener('mouseup', endShield);

    // Button 2: Fire / Hold 2s for Mega-Beam
    function startFire(e) {
      e.preventDefault();
      btnFire.classList.add('active');
      touchState.setAttribute('data-fire', '1');
      touchState.setAttribute('data-restart', '1');
    }
    function endFire(e) {
      e.preventDefault();
      btnFire.classList.remove('active');
      touchState.setAttribute('data-fire', '0');
      touchState.setAttribute('data-fire-released', '1');
    }
    btnFire.addEventListener('touchstart', startFire, { passive: false });
    btnFire.addEventListener('touchend', endFire, { passive: false });
    btnFire.addEventListener('touchcancel', endFire, { passive: false });
    btnFire.addEventListener('mousedown', startFire);
    btnFire.addEventListener('mouseup', endFire);

    // Swipe Zone: Smooth 1:1 proportional horizontal ship movement
    let swipeTouchId = null;
    let lastSwipeX = 0;

    swipeZone.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const t = e.changedTouches[0];
      swipeTouchId = t.identifier;
      lastSwipeX = t.clientX;
      const rect = swipeZone.getBoundingClientRect();
      swipeThumb.style.opacity = '1';
      swipeThumb.style.left = `${Math.max(4, Math.min(rect.width - 42, t.clientX - rect.left - 19))}px`;
    }, { passive: false });

    swipeZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === swipeTouchId) {
          const rect = swipeZone.getBoundingClientRect();
          const dxPx = t.clientX - lastSwipeX;
          lastSwipeX = t.clientX;
          swipeThumb.style.left = `${Math.max(4, Math.min(rect.width - 42, t.clientX - rect.left - 19))}px`;
          // Map swipe bar width to full 730px ship travel range
          const worldDx = dxPx * (730.0 / Math.max(120.0, rect.width));
          addSwipeDelta(worldDx);
        }
      }
    }, { passive: false });

    function endSwipe(e) {
      for (const t of e.changedTouches) {
        if (t.identifier === swipeTouchId) {
          swipeTouchId = null;
          swipeThumb.style.opacity = '0';
        }
      }
    }
    swipeZone.addEventListener('touchend', endSwipe, { passive: false });
    swipeZone.addEventListener('touchcancel', endSwipe, { passive: false });

    // Also allow swiping directly on the game canvas
    let canvasTouchId = null;
    let lastCanvasX = 0;
    canvas.addEventListener('touchstart', (e) => {
      const t = e.changedTouches[0];
      canvasTouchId = t.identifier;
      lastCanvasX = t.clientX;
      touchState.setAttribute('data-restart', '1');
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === canvasTouchId) {
          const rect = canvas.getBoundingClientRect();
          const dxPx = t.clientX - lastCanvasX;
          lastCanvasX = t.clientX;
          const worldDx = dxPx * (800.0 / Math.max(200.0, rect.width)) * 1.25;
          addSwipeDelta(worldDx);
        }
      }
    }, { passive: true });

    canvas.addEventListener('click', () => canvas.focus());

    init()
      .then(() => {
        loading.style.display = 'none';
        canvas.focus();
      })
      .catch((err) => {
        if (!err.message.startsWith("Using exceptions for control flow")) {
          console.error(err);
          loading.textContent = "Failed to load WebAssembly module.";
        } else {
          loading.style.display = 'none';
          canvas.focus();
        }
      });
  </script>
</body>
</html>
